name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: gaius-codius/go-ci/.github/workflows/go.yml@c2d8f3db725801cb8a6cf73ddedaf949bd5bdca7 # v2.1.1
    with:
      runs-on: '["ubuntu-latest"]'
      mise-cache: true
      timeout-minutes: 30
      tidy-check: true
      shellcheck: install.sh
      deadcode: true
      build: ./cmd/wicket/
      fuzz: |
        ./internal/config FuzzSave
        ./internal/importer FuzzParseRDP
        ./internal/importer FuzzParseRemmina

  # install.sh's tests skip a fetcher that is not installed. This job
  # installs every one, and makes a missing one fail instead.
  install-sh:
    name: install-sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install busybox and wget2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox wget2

      - name: Test install.sh
        env:
          WICKET_INSTALL_TESTS: all
        run: go test -count=1 -v -run '^TestInstall' .

  # go-ci is Linux-only; this job lints and tests the darwin and cgo files
  # (the Keychain backend, kqueue) natively.
  verify-macos:
    name: test-vet-fmt-macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Only the linter: the rest of mise.toml is for Linux CI and editors.
          install_args: golangci-lint
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run the pre-commit lint script with macOS's realpath
        # The hook must not need GNU coreutils: BSD realpath has no
        # --relative-to. Fails if the realpath on PATH is GNU's.
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          if realpath --relative-to=. . >/dev/null 2>&1; then
            echo "realpath on PATH is GNU's; this step would prove nothing"
            exit 1
          fi
          ./scripts/lint-packages.sh ./cmd/wicket/main.go internal/secret/store_darwin.go
          git diff --exit-code

      - name: Run tests
        env:
          WICKET_KEYCHAIN_TEST: "1"
        run: go test ./...

      - name: Build CLI
        run: go build -o /tmp/wicket ./cmd/wicket
