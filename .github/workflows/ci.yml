name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: gaius-codius/go-ci/.github/workflows/go.yml@25c4a99358e56e3ca2967d783de6dec46c0661de # v1.0.1
    with:
      runs-on: '["ubuntu-latest"]'
      mise-cache: true
      build: ./cmd/wicket/
      fuzz: |
        ./internal/config FuzzSave
        ./internal/importer FuzzParseRDP
        ./internal/importer FuzzParseRemmina

  # install.sh's tests skip a fetcher that is not installed. This job
  # installs every one, and makes a missing one fail instead.
  install-sh:
    name: install-sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install busybox and wget2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox wget2

      - name: Test install.sh
        env:
          WICKET_INSTALL_TESTS: all
        run: go test -count=1 -v -run '^TestInstall' .

  # go-ci is Linux-only; this job runs the Keychain backend's tests.
  verify-macos:
    name: test-vet-fmt-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        env:
          WICKET_KEYCHAIN_TEST: "1"
        run: go test ./...

      - name: Build CLI
        run: go build -o /tmp/wicket ./cmd/wicket
