name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          mkdir -p dist
          for arch in amd64 arm64; do
            name="wicket_${version}_linux_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${commit}" \
              -o "dist/$name/wicket" ./cmd/wicket
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag

      # The AUR steps stay inert until the maintainer adds the
      # AUR_SSH_PRIVATE_KEY secret. Pre-release tags (v1.2.0-rc1) are skipped
      # because '-' is not allowed in pkgver.
      - name: Check AUR key
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set; skipping the AUR update"
          elif [[ "$TAG" == *-* ]]; then
            echo "pre-release tag; skipping the AUR update"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # packaging/aur/wicket-bin/PKGBUILD is the template: only pkgver,
      # pkgrel and the checksums change per release.
      - name: Update PKGBUILD
        if: steps.aur.outputs.enabled == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sum() {
            awk -v f="wicket_${version}_linux_$1.tar.gz" '$2 == f { print $1 }' dist/SHA256SUMS
          }
          amd64="$(sum amd64)"
          arm64="$(sum arm64)"
          if [ -z "$amd64" ] || [ -z "$arm64" ]; then
            echo "missing checksums in dist/SHA256SUMS"
            exit 1
          fi
          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${amd64}')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm64}')/" \
            packaging/aur/wicket-bin/PKGBUILD
          git diff -- packaging/aur/wicket-bin/PKGBUILD

      # Builds the package from the just-published release (test: true),
      # regenerates .SRCINFO and pushes both files to the AUR.
      - name: Publish to AUR
        if: steps.aur.outputs.enabled == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: wicket-bin
          pkgbuild: packaging/aur/wicket-bin/PKGBUILD
          test: true
          commit_username: gaius-codius
          commit_email: gaius-codius@users.noreply.github.com
          commit_message: Update to ${{ github.ref_name }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
